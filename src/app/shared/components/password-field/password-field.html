<div class="example-container">
  <mat-form-field class="full-width">
    <mat-label>Digite sua Senha</mat-label>
    <input [formControl]="control" matInput [type]="hide() ? 'password' : 'text'" [placeholder]="placeholder" />
    <button
      mat-icon-button
      matSuffix
      type="button"
      (click)="clickEvent($event)"
      [attr.aria-label]="'Ocultar senha'"
      [attr.aria-pressed]="hide()"
    >
      <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
   @if(passwordErros){
    <mat-error>{{passwordErros}}</mat-error>
   }
  </mat-form-field>
</div>
