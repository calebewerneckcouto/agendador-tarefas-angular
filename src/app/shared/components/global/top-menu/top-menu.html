<mat-toolbar class="app-top-menu-toolbar">
    <span class="logo"><a routerLink="/"><img [src]="appLogo" alt="logo" class="logo-img" /></a></span>
    <span class="espacer"></span>
    <a mat-button routerLink="/" fragment="precos">Preços</a>
    <a mat-button routerLink="/" fragment="contato">Contato</a>

    <span class="espacer"></span>
    <button mat-button  [disabled]="estaNaRotaLogin()" routerLink="/login">Entrar</button>
    <button mat-button mat-flat-button  [disabled]="estaNaRotaRegister()" routerLink="/register">Cadastrar</button>
</mat-toolbar>
