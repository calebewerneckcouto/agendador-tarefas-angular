<div class="register-page">
  <mat-card class="register-card" appearance="outlined">
    <div class="register-brand">
      <div class="register-brand__icon" aria-hidden="true">
        <mat-icon>event_available</mat-icon>
      </div>
      <h1>Criar conta</h1>
      <p>Cadastre-se para organizar e acompanhar suas tarefas.</p>
    </div>

    <form class="register-form" novalidate [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
        <mat-label>Nome completo</mat-label>
        <mat-icon matIconPrefix>person_outline</mat-icon>
        <input matInput autocomplete="name" formControlName="nome" placeholder="Seu nome" />
        <mat-error *ngIf="form.get('nome')?.errors?.['required']">O nome é obrigatório</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
        <mat-label>E-mail</mat-label>
        <mat-icon matIconPrefix>mail_outline</mat-icon>
        <input matInput type="email" formControlName="email" autocomplete="email" placeholder="seu@email.com" />
        <mat-error *ngIf="form.get('email')?.errors?.['required']">O e-mail é obrigatório</mat-error>
        <mat-error *ngIf="form.get('email')?.errors?.['email']">Digite um e-mail válido</mat-error>
      </mat-form-field>

      <app-password-field [control]="senhaControl"></app-password-field>

      <button mat-flat-button class="register-submit" type="submit" (click)="submit()">Criar conta</button>
    </form>
  </mat-card>
</div>
